[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-reducer"
version = "0.1.0"
description = "Read-only project surface reducer with agent-assisted hook discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SurfaceReducer contributors"}]
dependencies = []

[project.scripts]
surface-reducer = "surfacereducer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
